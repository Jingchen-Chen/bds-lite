# Configuration for make_qualitative_figure.py (ACDC official test, D vs D+KD-band).
# Read-only inputs: raw NIfTI (geometry only), processed NPZ (image, GT), saved predictions.
# Nothing here modifies predictions, labels, or any frozen artifact.

paths:
  raw_root: data/raw/acdc_official_test
  npz_dir: data/processed/acdc_official_test/test
  eval_root: results/acdc_confirm_eval
  out_figures: paper/figures
  out_tables: results/tables/acdc_qualitative

# Arms as they appear in the paper. Do not rename "D+KD-band" to "BDS-Lite"
# (full BDS-Lite is D+F+G+S and has no official-test predictions).
arms:
  - key: decoder
    display: "D"
  - key: kd_band
    display: "D+KD-band"

seeds: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217]

selection:
  # Seed rule: among the 17 paired seeds, the seed whose registered run-level DSC difference
  # (D+KD-band minus D) is closest to the median of the 17 differences.
  seed_rule: closest_to_median_paired_delta
  # Case rule: slices whose GT contains RV, MYO and LV; paired per-slice delta at these percentiles,
  # the slice nearest the percentile value, with at most one slice per patient.
  case_percentiles: [90, 50, 10]
  expected_seed: 206
  expected_cases:
    - patient117_frame01_slice_4
    - patient121_frame10_slice_3
    - patient124_frame07_slice_6

display:
  # Physical field of view, centred on the GT centroid of each row's slice. Same mm window in every panel.
  fov_mm: 140   # 100 mm does not hold patient117 (needs 132.5 mm incl. 5 mm margin); see tables/acdc_qualitative/fov_check.csv
  # Missing area outside the image is filled with black (display only).
  scale_bar_mm: 10
  # Intensity: 0.5-99.5 percentile of the NPZ image inside the row's valid field, shared by all columns.
  intensity_percentiles: [0.5, 99.5]
  overlay_alpha: 0.45
  overlay_alpha_per_class:
    LV: 0.35   # yellow LV is glaring at 0.45; other classes stay at 0.45
  outline_linewidth_pt: 0.6
  # Difference column: dimmed grey MRI underneath; "both wrong" is a low-saturation neutral.
  diff_background_gain: 0.45   # difference column only: MRI brightness 45%
  both_wrong_alpha: 0.7   # light neutral over the dimmed MRI, see palette both_wrong
  font_family:            # first available is used; Liberation Sans is metric-compatible with Arial
    - Arial
    - Helvetica
    - Liberation Sans
    - DejaVu Sans
  pdf_embed_dpi: 804      # savefig dpi for the PDF: each 8x-upscaled panel (~1048 px) embeds without resampling
  pdf_upscale: 8          # PDF/PNG final export only: nearest-neighbour integer upscaling of raster panels
  font_size_pt: 7.5
  width_mm: 174        # double-column width; provisional until the PeerJ CS guide is checked
  preview_dpi: 200
  final_png_dpi: 600
  # Two candidate palettes. Classes are fixed; difference colours are disjoint from the class colours.
  palettes:
    A:
      RV: "#56B4E9"          # sky blue
      MYO: "#009E73"         # bluish green
      LV: "#B39600"          # deepened gold (less glaring than pure yellow)
      corrected: "#CC79A7"   # reddish purple: D wrong, D+KD-band right
      new_error: "#D55E00"   # vermillion: D right, D+KD-band wrong
      both_wrong: "#E0E0E0"  # light neutral
    B:
      RV: "#0072B2"          # blue
      MYO: "#009E73"         # bluish green
      LV: "#F0E442"          # yellow (Okabe-Ito)
      corrected: "#CC79A7"
      new_error: "#D55E00"
      both_wrong: "#E0E0E0"
