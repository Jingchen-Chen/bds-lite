extends:
  - configs/base.yaml
  - configs/datasets/isic2018.yaml

project:
  seed: 3
  output_dir: outputs

experiment:
  name: isic2018_ege_unet_seed3
  group: baselines_ege_unet
  dataset: isic2018
  model: ege_unet

model:
  name: ege_unet

loss:
  dice_weight: 1.0
  ce_weight: 1.0

trainer:
  device: cuda
  epochs: 150
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.00001
  amp: true
  save_every: 25
  scheduler: cosine
  grad_clip: 1.0
