extends:
  - configs/base.yaml
  - configs/datasets/acdc.yaml

project:
  seed: 2
  output_dir: outputs

experiment:
  name: acdc_ege_unet_seed2
  group: baselines_ege_unet
  dataset: acdc
  model: ege_unet

model:
  name: ege_unet

loss:
  dice_weight: 1.0
  ce_weight: 1.0

trainer:
  device: cuda
  epochs: 150
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.00001
  amp: true
  save_every: 25
  scheduler: cosine
  grad_clip: 1.0
