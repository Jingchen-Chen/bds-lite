extends:
  - configs/base.yaml
  - configs/datasets/isic2018.yaml

project:
  seed: 3

experiment:
  name: isic2018_e1_unet_gsl_long_seed3
  group: e1_unet_gsl_isic2018_long_schedule
  dataset: isic2018
  model: unet_gsl

model:
  name: unet
  base_channels: 32

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  boundary_weight: 0.0
  distill_weight: 0.0
  surface_weight: 0.0
  distance_weight: 0.0
  foreground_class_weights: null
  far_fp_weight: 0.0
  use_boundary_dou: false
  lambda_boundary_dou: 1.0
  use_gsl: true
  lambda_gsl: 1.0
  gsl_alpha_schedule: step5

trainer:
  device: cuda
  epochs: 800
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.00001
  amp: true
  save_every: 25
  scheduler: cosine
  grad_clip: 1.0
  init_from_checkpoint: null
  freeze_encoder_epochs: 0
