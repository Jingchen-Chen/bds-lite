extends:
  - configs/base.yaml
  - configs/datasets/synapse.yaml

experiment:
  name: synapse_bdslite_init_from_unet
  group: bds_lite_architectural

model:
  name: bdslite_unet
  base_channels: 32
  boundary_classes: 1
  boundary_gate: true
  boundary_gate_scale: 0.25
  disable_boundary_at_inference: true

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  boundary_weight: 0.05
  distill_weight: 0.05
  surface_weight: 1.0
  distance_weight: 0.0

trainer:
  epochs: 150
  batch_size: 16
  lr: 0.00005
  weight_decay: 0.00001
  amp: true
  save_every: 25
  scheduler: cosine
  grad_clip: 1.0
  device: cuda
  init_from_checkpoint: results/checkpoints/synapse_unet_baseline/best.pt
